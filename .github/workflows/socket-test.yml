name: Polymarket Market Test

on:
  workflow_dispatch:

jobs:
  market-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests

      - name: Run market test
        run: |
          python find_btc_market.py
